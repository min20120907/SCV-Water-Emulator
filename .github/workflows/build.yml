name: Flutter Multi-Platform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Use a matrix strategy to run the same steps on different runners and for different platforms
    strategy:
      matrix:
        platform: [android, ios, macos, windows, linux]
        
        # Define the runner (OS) required for each platform build
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4
      
      - name: 🎯 Set Up Flutter SDK
        # Uses the 'latest' stable version, which is generally recommended for CI
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest' 
          channel: 'stable'

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🧪 Run Tests
        # Runs tests for the first platform that supports it (usually Android/Linux runner)
        # If tests are platform-specific, add an 'if' condition here.
        run: flutter test

      # --- BUILD STEPS ---

      - name: 📱 Build Android App (APK)
        if: matrix.platform == 'android'
        # Builds a release APK; consider 'flutter build appbundle' for Google Play
        run: flutter build apk --release
        
      - name: 🍏 Build iOS Archive (IPA)
        if: matrix.platform == 'ios'
        # Note: This step REQUIRES codesigning setup (Certificates/Profiles stored as Secrets)
        # Without codesigning, this step will fail.
        run: flutter build ipa --release
          
      - name: 💻 Build macOS App
        if: matrix.platform == 'macos'
        run: flutter build macos --release
          
      - name: 🖼️ Build Windows App
        if: matrix.platform == 'windows'
        run: flutter build windows --release
        
      - name: 🐧 Build Linux App
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      # --- ARTIFACT UPLOAD ---

      - name: ⬆️ Upload ${{ matrix.platform }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          # Dynamically finds the output directory for the platform
          path: |
            build/${{ matrix.platform }}/* # Exclude the flutter_assets folder to save space/time, as it's often duplicated.
          # If you need every single file, remove the exclusion.
          retention-days: 7
