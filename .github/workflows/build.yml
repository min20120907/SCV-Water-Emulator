name: Flutter Multi-Platform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Use a matrix strategy to run the same steps on different runners and for different platforms
    strategy:
      matrix:
        platform: [android, ios, macos, windows, linux]
        
        # Define the runner (OS) required for each platform build
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4
      
      - name: 🎯 Set Up Flutter SDK
        # Using 'latest' stable version, which should fix the version detection error.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest' 
          channel: 'stable'
          # Removed non-essential inputs like 'architecture' to improve reliability.

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🧪 Run Tests
        # Runs 'flutter test' once per job run (per platform)
        run: flutter test

      # --- BUILD STEPS ---

      - name: 📱 Build Android App (APK)
        if: matrix.platform == 'android'
        # Builds a release APK. Use 'flutter build appbundle' for Google Play Store.
        run: flutter build apk --release
        
      - name: 🍏 Build iOS Archive (IPA)
        if: matrix.platform == 'ios'
        # REQUIRES Codesigning credentials (certificates/profiles) set up as GitHub Secrets!
        run: flutter build ipa --release
          
      - name: 💻 Build macOS App
        if: matrix.platform == 'macos'
        run: flutter build macos --release
          
      - name: 🖼️ Build Windows App
        if: matrix.platform == 'windows'
        run: flutter build windows --release
        
      - name: 🐧 Build Linux App
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      # --- ARTIFACT UPLOAD ---

      - name: ⬆️ Upload ${{ matrix.platform }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          # Dynamically sets the path to the platform build folder
          path: build/${{ matrix.platform }}/* retention-days: 7
